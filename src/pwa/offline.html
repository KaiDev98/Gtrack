<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#465fff" />
    <meta name="description" content="Kamu sedang offline. Gym Tracker menyimpan latihanmu di perangkat ini." />
    <title>Offline | Gym Tracker</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="images/favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="flex min-h-screen items-center justify-center bg-gray-50 px-5 font-outfit text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100">
    <main class="w-full max-w-md rounded-3xl border border-gray-200 bg-white p-8 text-center shadow-theme-lg dark:border-gray-800 dark:bg-white/[0.03]">
      <span class="mx-auto flex size-16 items-center justify-center rounded-3xl bg-gradient-to-br from-brand-500 to-brand-700 shadow-lg shadow-brand-500/30">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9.5v5M7 7.5v9M17 7.5v9M20 9.5v5M7 12h10" stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
      </span>
      <p class="mt-6 text-xs font-semibold uppercase tracking-[0.18em] text-brand-500">Gym Tracker</p>
      <h1 class="mt-2 text-2xl font-semibold tracking-tight text-gray-900 dark:text-white">Kamu sedang offline</h1>
      <p class="mt-3 text-sm leading-relaxed text-gray-500 dark:text-gray-400">
        Halaman ini belum tersimpan di perangkatmu. Data latihan yang sudah ada tetap aman di penyimpanan lokal.
        Sambungkan internet lalu coba lagi.
      </p>

      <button
        type="button"
        onclick="window.location.reload()"
        class="mt-6 inline-flex h-11 w-full items-center justify-center gap-2 rounded-xl bg-brand-500 px-5 text-sm font-semibold text-white shadow-theme-xs transition hover:bg-brand-600"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Coba lagi
      </button>
      <a
        href="dashboard.html"
        class="mt-3 inline-flex h-11 w-full items-center justify-center rounded-xl border border-gray-200 bg-white px-5 text-sm font-semibold text-gray-700 transition hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300 dark:hover:bg-gray-800"
      >
        Kembali ke dashboard
      </a>

      <p class="mt-6 text-[11px] text-gray-400">Latihanmu tersimpan lokal dan tidak hilang saat offline.</p>
    </main>
  </body>
</html>
