<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#465fff" />
    <meta name="description" content="Buat akun Gym Tracker dan mulai catat latihan bebanmu." />
    <title>Daftar | Gym Tracker</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="images/favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body
    style="visibility: hidden"
    data-page="signup"
    data-auth="guest"
    x-data="appShell('signup')"
    :class="{ 'dark': darkMode }"
    class="bg-white font-outfit text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100"
  >
    <div class="flex min-h-screen">
      <include src="./partials/auth/brand-panel.html" />

      <div class="flex w-full flex-col lg:w-1/2">
        <div class="flex items-center justify-between px-5 pt-5 sm:px-8 lg:justify-end">
          <a href="index.html" class="flex items-center gap-2.5 lg:hidden" aria-label="Gym Tracker">
            <span class="flex size-10 items-center justify-center rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 shadow-lg shadow-brand-500/25">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 9.5v5M7 7.5v9M17 7.5v9M20 9.5v5M7 12h10" stroke="white" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
            <span class="leading-tight">
              <span class="block text-base font-semibold tracking-tight text-gray-900 dark:text-white">Gym Tracker</span>
              <span class="block text-[9px] font-semibold uppercase tracking-[0.18em] text-brand-500">Track your gains</span>
            </span>
          </a>
          <button
            type="button"
            @click="darkMode = !darkMode"
            class="inline-flex size-10 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-600 transition hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300 dark:hover:bg-gray-800"
            :aria-label="darkMode ? 'Aktifkan mode terang' : 'Aktifkan mode gelap'"
          >
            <svg x-show="darkMode" width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6" />
              <path d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <svg x-show="!darkMode" width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M6.25 6.67a6.67 6.67 0 0 0 11.2 4.88A7.71 7.71 0 1 1 8.03 2.13a6.65 6.65 0 0 0-1.78 4.54Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <main class="flex flex-1 items-center px-5 py-10 sm:px-8">
          <div class="mx-auto w-full max-w-md" x-data="signupPage()">
            <p class="text-xs font-semibold uppercase tracking-[0.18em] text-brand-500">Mulai gratis</p>
            <h1 class="mt-2 text-3xl font-semibold tracking-tight text-gray-900 dark:text-white">Buat akun baru</h1>
            <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Satu menit daftar, langsung bisa menyusun program pertamamu.</p>

            <form class="mt-7 space-y-4" @submit.prevent="submit()" novalidate>
              <p x-show="error" x-cloak class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-600 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-400" x-text="error"></p>

              <div>
                <label for="name" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Nama lengkap</label>
                <input
                  id="name"
                  type="text"
                  autocomplete="name"
                  x-model.trim="name"
                  placeholder="Nama kamu"
                  class="h-12 w-full rounded-xl border bg-transparent px-4 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:ring-brand-500/10 dark:text-white"
                  :class="errors.name ? 'border-red-400 focus:border-red-400' : 'border-gray-300 focus:border-brand-300 dark:border-gray-700'"
                />
                <p x-show="errors.name" x-cloak class="mt-1 text-xs text-red-500" x-text="errors.name"></p>
              </div>

              <div>
                <label for="email" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
                <input
                  id="email"
                  type="email"
                  autocomplete="email"
                  x-model.trim="email"
                  placeholder="nama@email.com"
                  class="h-12 w-full rounded-xl border bg-transparent px-4 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:ring-brand-500/10 dark:text-white"
                  :class="errors.email ? 'border-red-400 focus:border-red-400' : 'border-gray-300 focus:border-brand-300 dark:border-gray-700'"
                />
                <p x-show="errors.email" x-cloak class="mt-1 text-xs text-red-500" x-text="errors.email"></p>
              </div>

              <div class="grid gap-4 sm:grid-cols-2">
                <div>
                  <label for="password" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                  <div class="relative">
                    <input
                      id="password"
                      :type="showPassword ? 'text' : 'password'"
                      autocomplete="new-password"
                      x-model="password"
                      placeholder="Min. 8 karakter"
                      class="h-12 w-full rounded-xl border bg-transparent px-4 pr-11 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:ring-brand-500/10 dark:text-white"
                      :class="errors.password ? 'border-red-400 focus:border-red-400' : 'border-gray-300 focus:border-brand-300 dark:border-gray-700'"
                    />
                    <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200" :aria-label="showPassword ? 'Sembunyikan password' : 'Tampilkan password'">
                      <svg x-show="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.6" /><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" /></svg>
                      <svg x-show="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A9.9 9.9 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.1 3.8M6.6 6.6C4 8.3 2.5 12 2.5 12S6 18 12 18a9.7 9.7 0 0 0 4.2-.9M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    </button>
                  </div>
                  <p x-show="errors.password" x-cloak class="mt-1 text-xs text-red-500" x-text="errors.password"></p>
                </div>

                <div>
                  <label for="confirm" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Ulangi password</label>
                  <input
                    id="confirm"
                    :type="showPassword ? 'text' : 'password'"
                    autocomplete="new-password"
                    x-model="confirm"
                    placeholder="Ketik ulang"
                    class="h-12 w-full rounded-xl border bg-transparent px-4 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:ring-brand-500/10 dark:text-white"
                    :class="errors.confirm ? 'border-red-400 focus:border-red-400' : 'border-gray-300 focus:border-brand-300 dark:border-gray-700'"
                  />
                  <p x-show="errors.confirm" x-cloak class="mt-1 text-xs text-red-500" x-text="errors.confirm"></p>
                </div>
              </div>

              <div>
                <label class="flex cursor-pointer items-start gap-2.5 text-sm text-gray-600 dark:text-gray-400">
                  <input type="checkbox" x-model="agree" class="mt-0.5 size-4 rounded border-gray-300 text-brand-500 focus:ring-brand-500" />
                  <span>Saya setuju dengan ketentuan penggunaan dan kebijakan privasi demo lokal ini.</span>
                </label>
                <p x-show="errors.agree" x-cloak class="mt-1 text-xs text-red-500" x-text="errors.agree"></p>
              </div>

              <button
                type="submit"
                :disabled="loading"
                class="flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-brand-500 text-sm font-semibold text-white shadow-theme-xs transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60"
              >
                <svg x-show="loading" class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".3" stroke-width="3" /><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" /></svg>
                <span x-text="loading ? 'Membuat akun…' : 'Daftar & mulai'"></span>
              </button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
              Sudah punya akun?
              <a href="signin.html" class="font-semibold text-brand-500 hover:text-brand-600">Masuk di sini</a>
            </p>
          </div>
        </main>
      </div>
    </div>

    <include src="./partials/layout/toast.html" />
  </body>
</html>
