<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#465fff" />
    <title>Sesi Latihan | Gym Tracker</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="images/favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body
    style="visibility: hidden"
    data-page="workout"
    data-auth="required"
    x-data="appShell('workout')"
    :class="{ 'dark': darkMode }"
    class="bg-gray-50 font-outfit text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100"
  >
    <div class="flex h-screen overflow-hidden">
      <include src="./partials/layout/sidebar.html" />
      <div class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto">
        <main id="main-content">
          <include src="./partials/layout/header.html" />

          <div x-data="workoutPage()" x-init="init()">
            <template x-if="session">
              <div class="mx-auto max-w-3xl p-4 pb-28 md:p-6 xl:pb-8">
              <!-- Session header -->
              <div class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-theme-xs dark:border-gray-800 dark:bg-white/[0.03]">
                <div class="h-1 w-full" :style="`background:${split.hex}`"></div>
                <div class="p-4 sm:p-5">
                  <div class="flex flex-wrap items-start justify-between gap-3">
                    <div class="flex items-start gap-3">
                      <span class="flex size-12 items-center justify-center rounded-2xl text-sm font-bold" :style="`background-color:${split.soft};color:${split.hex}`" x-text="split.short.slice(0,2).toUpperCase()"></span>
                      <div>
                        <div class="flex flex-wrap items-center gap-2">
                          <h2 class="text-xl font-semibold text-gray-900 dark:text-white" x-text="split.label + ' Day'"></h2>
                          <span class="rounded-full px-2 py-0.5 text-[10px] font-semibold" :class="status.className" x-text="status.label"></span>
                        </div>
                        <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400" x-text="dateLabel"></p>
                      </div>
                    </div>
                    <div class="flex items-center gap-2">
                      <button type="button" @click="openTemplateModal()" class="inline-flex h-10 items-center gap-1.5 rounded-lg border border-gray-200 px-3 text-xs font-semibold text-gray-600 transition hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4V4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" /></svg>
                        Template
                      </button>
                      <button type="button" @click="finishWorkout()" class="inline-flex h-10 items-center gap-1.5 rounded-lg bg-green-500 px-4 text-xs font-semibold text-white transition hover:bg-green-600">
                        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m4 10.5 4 4 8-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                        Selesai
                      </button>
                    </div>
                  </div>

                  <!-- Stats -->
                  <div class="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-4">
                    <div class="rounded-xl bg-gray-50 p-3 dark:bg-white/5">
                      <p class="font-mono text-xl font-semibold tabular-nums text-gray-900 dark:text-white" x-text="isStarted ? elapsedLabel : '--:--'"></p>
                      <p class="text-[10px] uppercase tracking-wide text-gray-400">waktu berjalan</p>
                    </div>
                    <div class="rounded-xl bg-gray-50 p-3 dark:bg-white/5">
                      <p class="text-xl font-semibold text-gray-900 dark:text-white" x-text="volumeText()"></p>
                      <p class="text-[10px] uppercase tracking-wide text-gray-400">volume</p>
                    </div>
                    <div class="rounded-xl bg-gray-50 p-3 dark:bg-white/5">
                      <p class="text-xl font-semibold text-gray-900 dark:text-white"><span x-text="doneSets"></span><span class="text-sm text-gray-400">/</span><span class="text-sm text-gray-500" x-text="totalSets"></span></p>
                      <p class="text-[10px] uppercase tracking-wide text-gray-400">set selesai</p>
                    </div>
                    <div class="rounded-xl bg-gray-50 p-3 dark:bg-white/5">
                      <div class="flex items-baseline gap-1">
                        <input type="number" min="0" inputmode="numeric" x-model.number="durationInput" @input="durationTouched = true; autosave()" class="w-14 border-0 bg-transparent p-0 text-xl font-semibold text-gray-900 focus:ring-0 dark:text-white" aria-label="Durasi latihan dalam menit" />
                        <span class="text-xs text-gray-500">mnt</span>
                      </div>
                      <p class="text-[10px] uppercase tracking-wide text-gray-400">durasi</p>
                    </div>
                  </div>

                  <div x-show="!isStarted" class="mt-4 flex flex-col items-start gap-3 rounded-xl border border-brand-100 bg-brand-50 p-4 sm:flex-row sm:items-center dark:border-brand-500/20 dark:bg-brand-500/10">
                    <span class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-white text-lg shadow-theme-xs dark:bg-gray-900">⏱️</span>
                    <div class="flex-1">
                      <p class="text-sm font-semibold text-gray-900 dark:text-white">Sesi belum dimulai</p>
                      <p class="text-xs text-gray-600 dark:text-gray-400">Mulai agar durasi, wake lock, dan rest timer aktif otomatis.</p>
                    </div>
                    <button type="button" @click="startWorkout()" class="w-full rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-600 sm:w-auto">Mulai Latihan</button>
                  </div>

                  <p x-show="savedAt" class="mt-3 flex items-center gap-1.5 text-[11px] text-gray-400">
                    <span class="size-1.5 rounded-full bg-green-500"></span>
                    Tersimpan otomatis <span x-text="savedAt ? 'pukul ' + savedAt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : ''"></span>
                  </p>
                </div>
              </div>

              <!-- Exercises -->
              <div class="mt-5 flex items-center justify-between">
                <div>
                  <h3 class="text-base font-semibold text-gray-900 dark:text-white">Gerakan</h3>
                  <p class="text-xs text-gray-500 dark:text-gray-400"><span x-text="session.exercises.length"></span> gerakan · isi beban & repetisi aktual</p>
                </div>
                <button type="button" @click="startRest(90)" class="inline-flex h-9 items-center gap-1.5 rounded-lg border border-gray-200 px-3 text-xs font-semibold text-gray-600 transition hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="1.8" /><path d="M12 9v4l2.5 2.5M9 2h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
                  Rest timer
                </button>
              </div>

              <div class="mt-3 space-y-4">
                <template x-for="(ex, exIndex) in session.exercises" :key="ex.id">
                  <div class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-theme-xs dark:border-gray-800 dark:bg-white/[0.03]">
                    <div class="flex items-start gap-3 border-b border-gray-100 p-4 dark:border-gray-800">
                      <span class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-brand-50 text-xs font-bold text-brand-600 dark:bg-brand-500/15 dark:text-brand-400" x-text="exIndex + 1"></span>
                      <div class="min-w-0 flex-1">
                        <p class="truncate text-sm font-semibold text-gray-900 dark:text-white" x-text="exerciseName(ex.exerciseId)"></p>
                        <p class="text-[11px] text-gray-500 dark:text-gray-400" x-text="exerciseMeta(ex.exerciseId)"></p>
                        <p class="mt-1 text-[11px] font-medium text-brand-500" x-text="previousLabel(ex.exerciseId)"></p>
                      </div>
                      <div class="flex items-center gap-1">
                        <button type="button" @click="moveExercise(exIndex, -1)" :disabled="exIndex === 0" class="flex size-8 items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 disabled:opacity-30 dark:hover:bg-white/5" aria-label="Naikkan gerakan">
                          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 12.5 5-5 5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
                        </button>
                        <button type="button" @click="moveExercise(exIndex, 1)" :disabled="exIndex === session.exercises.length - 1" class="flex size-8 items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 disabled:opacity-30 dark:hover:bg-white/5" aria-label="Turunkan gerakan">
                          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 7.5 5 5 5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
                        </button>
                        <button type="button" @click="removeExercise(ex)" class="flex size-8 items-center justify-center rounded-lg text-gray-400 hover:bg-red-50 hover:text-red-500 dark:hover:bg-red-500/10" aria-label="Hapus gerakan">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2m-8 0 1 13h8l1-13M10 11v5m4-5v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
                        </button>
                      </div>
                    </div>

                    <div class="p-3 sm:p-4">
                      <div class="mb-1.5 hidden grid-cols-[2.25rem_6rem_minmax(0,1fr)_5rem_3rem] gap-2 px-1 text-[10px] font-semibold uppercase tracking-wide text-gray-400 sm:grid">
                        <span>Set</span>
                        <span>Sebelumnya</span>
                        <span>Beban (<span x-text="unit"></span>)</span>
                        <span class="text-center">Reps</span>
                        <span class="text-center">✓</span>
                      </div>

                      <div class="space-y-1.5">
                        <template x-for="(set, setIndex) in ex.sets" :key="set.id">
                          <div class="grid grid-cols-[2rem_minmax(0,1fr)_4.25rem_2.5rem] items-center gap-1.5 rounded-xl border p-2 transition sm:grid-cols-[2.25rem_6rem_minmax(0,1fr)_5rem_3rem] sm:gap-2 sm:p-2.5" :class="set.isCompleted ? 'border-green-200 bg-green-50/50 dark:border-green-500/20 dark:bg-green-500/5' : 'border-gray-200 bg-white dark:border-gray-800 dark:bg-transparent'">
                            <div class="flex flex-col items-center justify-center">
                              <span class="text-xs font-bold text-gray-500 dark:text-gray-400" x-text="setIndex + 1"></span>
                              <span class="mt-0.5 max-w-full truncate text-[8px] leading-tight text-gray-400 sm:hidden" x-text="previousFor(ex.exerciseId, setIndex) ? previousFor(ex.exerciseId, setIndex).reps + 'r' : '—'"></span>
                            </div>
                            <div class="hidden text-[11px] text-gray-500 sm:block dark:text-gray-400">
                              <template x-if="previousFor(ex.exerciseId, setIndex)">
                                <span x-text="weightText(previousFor(ex.exerciseId, setIndex).weight) + ' × ' + previousFor(ex.exerciseId, setIndex).reps"></span>
                              </template>
                              <template x-if="!previousFor(ex.exerciseId, setIndex)">
                                <span class="text-gray-300 dark:text-gray-600">—</span>
                              </template>
                            </div>

                            <div class="flex h-10 min-w-0 items-center rounded-lg border border-gray-300 bg-white dark:border-gray-700 dark:bg-gray-900">
                              <button type="button" @click="adjustWeight(set, -increment)" class="flex h-full w-7 shrink-0 items-center justify-center rounded-l-lg text-sm font-bold text-gray-500 hover:bg-gray-50 dark:text-gray-400 dark:hover:bg-white/5" :aria-label="'Kurangi beban set ' + (setIndex + 1)">−</button>
                              <input
                                type="number"
                                inputmode="decimal"
                                min="0"
                                step="0.5"
                                :value="set.uiWeight"
                                @input="setWeight(set, $event.target.value)"
                                class="h-full w-full min-w-0 appearance-none border-0 bg-transparent p-0 text-center text-sm font-semibold tabular-nums text-gray-900 focus:ring-0 dark:text-white"
                                :aria-label="'Beban set ' + (setIndex + 1)"
                              />
                              <button type="button" @click="adjustWeight(set, increment)" class="flex h-full w-7 shrink-0 items-center justify-center rounded-r-lg text-sm font-bold text-gray-500 hover:bg-gray-50 dark:text-gray-400 dark:hover:bg-white/5" :aria-label="'Tambah beban set ' + (setIndex + 1)">+</button>
                            </div>

                            <input
                              type="number"
                              inputmode="numeric"
                              min="1"
                              step="1"
                              :value="set.reps"
                              @input="setReps(set, $event.target.value)"
                              class="h-10 w-full rounded-lg border border-gray-300 bg-white text-center text-sm font-semibold tabular-nums text-gray-900 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white"
                              :aria-label="'Repetisi set ' + (setIndex + 1)"
                            />

                            <button
                              type="button"
                              @click="toggleSet(ex, set)"
                              class="flex size-10 items-center justify-center rounded-lg border transition"
                              :class="set.isCompleted ? 'border-green-500 bg-green-500 text-white' : 'border-gray-300 text-gray-300 hover:border-green-400 hover:text-green-500 dark:border-gray-700 dark:text-gray-600'"
                              :aria-label="set.isCompleted ? 'Batalkan set ' + (setIndex + 1) : 'Selesaikan set ' + (setIndex + 1)"
                              :aria-pressed="set.isCompleted"
                            >
                              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m4 10.5 4 4 8-9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                            </button>
                          </div>
                        </template>
                      </div>

                      <div class="mt-2.5 flex items-center gap-2">
                        <button type="button" @click="addSet(ex)" class="inline-flex items-center gap-1.5 rounded-lg border border-dashed border-gray-300 px-3 py-1.5 text-[11px] font-semibold text-gray-500 transition hover:border-brand-300 hover:text-brand-500 dark:border-gray-700 dark:text-gray-400">
                          <svg width="12" height="12" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
                          Tambah set
                        </button>
                        <button type="button" @click="copyPreviousSet(ex, ex.sets.length - 1)" class="rounded-lg px-2 py-1.5 text-[11px] font-medium text-gray-400 hover:text-brand-500">Salin set sebelumnya</button>
                        <button type="button" @click="removeSet(ex, ex.sets.length - 1)" class="ml-auto text-[11px] font-medium text-gray-400 hover:text-red-500">Hapus set terakhir</button>
                      </div>

                      <input type="text" x-model="ex.note" @input="autosave()" placeholder="Catatan gerakan (opsional) — mis. tempo lambat, nyeri bahu" class="mt-2.5 h-9 w-full rounded-lg border border-gray-200 bg-gray-50 px-3 text-xs text-gray-700 placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 dark:border-gray-800 dark:bg-white/5 dark:text-gray-300" />
                    </div>
                  </div>
                </template>

                <button type="button" @click="openPicker()" class="flex w-full items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-gray-200 px-4 py-5 text-sm font-semibold text-gray-500 transition hover:border-brand-300 hover:bg-brand-50/40 hover:text-brand-600 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-brand-500/5">
                  <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
                  Tambah gerakan
                </button>
              </div>

              <!-- Journal -->
              <div class="mt-5 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-theme-xs dark:border-gray-800 dark:bg-white/[0.03]">
                <button type="button" @click="journalOpen = !journalOpen" class="flex w-full items-center justify-between p-4 text-left">
                  <div class="flex items-center gap-3">
                    <span class="flex size-9 items-center justify-center rounded-xl bg-purple-50 text-base dark:bg-purple-500/15">📝</span>
                    <div>
                      <p class="text-sm font-semibold text-gray-900 dark:text-white">Jurnal sesi <span class="font-normal text-gray-400">(opsional)</span></p>
                      <p class="text-[11px] text-gray-500 dark:text-gray-400">Catat kelelahan, kualitas tidur, mood, dan kendala.</p>
                    </div>
                  </div>
                  <svg class="size-5 text-gray-400 transition" :class="journalOpen ? 'rotate-180' : ''" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 7.5 5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
                </button>
                <div x-show="journalOpen" x-collapse class="border-t border-gray-100 p-4 dark:border-gray-800">
                  <div class="space-y-4">
                    <div>
                      <label class="mb-1.5 block text-xs font-semibold text-gray-700 dark:text-gray-300">Catatan</label>
                      <textarea x-model="session.journal.notes" @input="autosave()" rows="3" placeholder="Bagaimana sesi hari ini? Apa yang perlu ditingkatkan?" class="w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:text-white"></textarea>
                    </div>
                    <div class="grid gap-3 sm:grid-cols-3">
                      <template x-for="scale in [{key:'fatigue',label:'Kelelahan'},{key:'sleep',label:'Kualitas tidur'},{key:'mood',label:'Mood / energi'}]" :key="scale.key">
                        <div>
                          <p class="mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300" x-text="scale.label"></p>
                          <div class="flex gap-1">
                            <template x-for="value in [1,2,3,4,5]" :key="value">
                              <button type="button" @click="setJournalScale(scale.key, value)" class="flex size-9 items-center justify-center rounded-lg border text-xs font-semibold transition" :class="session.journal[scale.key] === value ? 'border-brand-500 bg-brand-500 text-white' : 'border-gray-200 text-gray-500 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-white/5'" x-text="value"></button>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                    <div>
                      <label class="mb-1.5 block text-xs font-semibold text-gray-700 dark:text-gray-300">Tag kendala</label>
                      <input type="text" x-model="journalTags" @input="saveJournalLocal()" placeholder="mis. nyeri bahu, grip lemah, kurang tidur" class="h-10 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:text-white" />
                      <p class="mt-1 text-[10px] text-gray-400">Pisahkan dengan koma.</p>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Finish -->
              <div class="mt-5 rounded-2xl border border-gray-200 bg-white p-4 shadow-theme-xs dark:border-gray-800 dark:bg-white/[0.03]">
                <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                  <div>
                    <p class="text-sm font-semibold text-gray-900 dark:text-white">Sudah selesai?</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Durasi, volume, dan PR akan dihitung otomatis.</p>
                  </div>
                  <button type="button" @click="finishWorkout()" class="inline-flex h-11 items-center justify-center gap-2 rounded-lg bg-green-500 px-5 text-sm font-semibold text-white transition hover:bg-green-600">
                    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m4 10.5 4 4 8-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    Selesai Latihan
                  </button>
                </div>
              </div>
              </div>
            </template>

            <!-- Exercise picker modal -->
    <div x-cloak x-show="pickerOpen" x-transition.opacity class="fixed inset-0 z-[70] flex items-end justify-center bg-gray-900/50 p-0 backdrop-blur-sm sm:items-center sm:p-4">
      <div @click.outside="pickerOpen = false" class="flex max-h-[92vh] w-full max-w-lg flex-col rounded-t-3xl bg-white shadow-2xl sm:rounded-2xl dark:bg-gray-900">
        <div class="flex items-center justify-between border-b border-gray-100 p-4 dark:border-gray-800">
          <div>
            <h3 class="text-base font-semibold text-gray-900 dark:text-white">Tambah gerakan</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400">Cari library atau buat gerakan custom.</p>
          </div>
          <button type="button" @click="pickerOpen = false" class="rounded-lg p-1.5 text-gray-400 hover:bg-gray-100 dark:hover:bg-white/5" aria-label="Tutup">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="m3 3 12 12M15 3 3 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
          </button>
        </div>
        <div class="p-4">
          <input type="search" x-model="exerciseSearch" placeholder="Cari gerakan, mis. bench, squat, dada..." class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:text-white" />
          <button type="button" @click="customOpen = !customOpen" class="mt-2 text-xs font-semibold text-brand-500" x-text="customOpen ? 'Tutup form custom' : '+ Buat gerakan custom'"></button>
          <div x-show="customOpen" class="mt-2 grid gap-2 rounded-xl bg-gray-50 p-3 sm:grid-cols-2 dark:bg-white/5">
            <input type="text" x-model="custom.name" placeholder="Nama gerakan" class="h-10 rounded-lg border border-gray-300 bg-white px-3 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white" />
            <select x-model="custom.muscle" class="h-10 rounded-lg border border-gray-300 bg-white px-3 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white">
              <option>Dada</option><option>Punggung</option><option>Kaki</option><option>Bahu</option><option>Lengan</option><option>Core</option><option>Cardio</option><option>Full Body</option>
            </select>
            <select x-model="custom.type" class="h-10 rounded-lg border border-gray-300 bg-white px-3 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white">
              <option value="weighted">Beban</option><option value="bodyweight">Bodyweight</option><option value="cardio">Cardio</option>
            </select>
            <button type="button" @click="createCustomExercise()" class="h-10 rounded-lg bg-brand-500 text-sm font-semibold text-white hover:bg-brand-600">Tambah custom</button>
          </div>
        </div>
        <div class="min-h-0 flex-1 overflow-y-auto border-t border-gray-100 p-2 dark:border-gray-800">
          <template x-for="exercise in filteredExercises" :key="exercise.id">
            <button type="button" @click="addExercise(exercise)" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition hover:bg-gray-50 dark:hover:bg-white/5">
              <span class="flex size-9 items-center justify-center rounded-lg bg-gray-100 text-xs font-bold text-gray-500 dark:bg-white/5 dark:text-gray-400" x-text="exercise.muscle.slice(0, 2).toUpperCase()"></span>
              <span class="min-w-0 flex-1">
                <span class="block truncate text-sm font-medium text-gray-900 dark:text-white" x-text="exercise.name"></span>
                <span class="block text-[11px] text-gray-500 dark:text-gray-400" x-text="exercise.muscle + ' · ' + (exercise.type === 'bodyweight' ? 'Bodyweight' : exercise.type === 'cardio' ? 'Cardio' : 'Beban')"></span>
              </span>
              <svg class="size-4 text-gray-300" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
            </button>
          </template>
          <template x-if="filteredExercises.length === 0">
            <p class="px-4 py-8 text-center text-xs text-gray-500">Tidak ada gerakan yang cocok. Buat custom di atas.</p>
          </template>
        </div>
      </div>
    </div>

    <!-- Save as template modal -->
    <div x-cloak x-show="templateOpen" x-transition.opacity class="fixed inset-0 z-[70] flex items-center justify-center bg-gray-900/50 p-4 backdrop-blur-sm">
      <div @click.outside="templateOpen = false" class="w-full max-w-sm rounded-2xl bg-white p-5 shadow-2xl dark:bg-gray-900">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Simpan sebagai template</h3>
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Gerakan dan jumlah set akan disimpan. Beban aktual tetap di riwayat sesi.</p>
        <label class="mt-4 mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Nama template</label>
        <input type="text" x-model="templateName" class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:text-white" />
        <div class="mt-5 flex gap-2">
          <button type="button" @click="templateOpen = false" class="flex-1 rounded-lg border border-gray-200 px-3 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5">Batal</button>
          <button type="button" @click="saveAsTemplate()" class="flex-1 rounded-lg bg-brand-500 px-3 py-2.5 text-sm font-semibold text-white hover:bg-brand-600">Simpan</button>
        </div>
      </div>
    </div>

          </div>
        </main>
      </div>
    </div>

    <include src="./partials/layout/bottom-nav.html" />
    <include src="./partials/layout/rest-timer.html" />
    <include src="./partials/layout/toast.html" />
    <include src="./partials/layout/pr-celebration.html" />
  </body>
</html>
