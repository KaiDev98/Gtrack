<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#465fff" />
    <title>Ringkasan Sesi | Gym Tracker</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="images/favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body
    style="visibility: hidden"
    data-page="summary"
    data-auth="required"
    x-data="appShell('summary')"
    :class="{ 'dark': darkMode }"
    class="bg-gray-50 font-outfit text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100"
  >
    <div class="flex h-screen overflow-hidden">
      <include src="./partials/layout/sidebar.html" />
      <div class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto">
        <main id="main-content">
          <include src="./partials/layout/header.html" />

          <div class="mx-auto max-w-3xl p-4 pb-28 md:p-6 xl:pb-8" x-data="summaryPage()" x-init="init()">
            <template x-if="session">
              <div>
                <!-- Hero -->
                <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-green-500 to-emerald-700 p-6 text-white shadow-lg shadow-green-500/20">
                  <div class="pointer-events-none absolute -right-10 -top-10 size-44 rounded-full bg-white/10 blur-2xl"></div>
                  <div class="relative flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                    <div class="flex items-center gap-4">
                      <span class="flex size-14 items-center justify-center rounded-2xl bg-white/15 text-2xl backdrop-blur">🏁</span>
                      <div>
                        <p class="text-xs font-semibold uppercase tracking-[0.18em] text-green-100">Sesi selesai</p>
                        <h2 class="mt-1 text-2xl font-semibold" x-text="split.label + ' Day'"></h2>
                        <p class="text-sm text-green-100" x-text="dateLabel"></p>
                      </div>
                    </div>
                    <div class="flex flex-wrap gap-2">
                      <button type="button" @click="openTemplate()" class="rounded-lg bg-white/15 px-3 py-2 text-xs font-semibold backdrop-blur transition hover:bg-white/25">Simpan template</button>
                      <button type="button" @click="repeatSession()" class="rounded-lg bg-white px-3 py-2 text-xs font-semibold text-green-700 transition hover:bg-green-50">Ulangi sesi</button>
                    </div>
                  </div>
                </div>

                <!-- Metrics -->
                <div class="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-4">
                  <div class="rounded-2xl border border-gray-200 bg-white p-4 shadow-theme-xs dark:border-gray-800 dark:bg-white/[0.03]">
                    <p class="text-[10px] font-semibold uppercase tracking-wide text-gray-400">Durasi</p>
                    <p class="mt-1 text-xl font-semibold text-gray-900 dark:text-white" x-text="durationText(session.durationMinutes)"></p>
                  </div>
                  <div class="rounded-2xl border border-gray-200 bg-white p-4 shadow-theme-xs dark:border-gray-800 dark:bg-white/[0.03]">
                    <p class="text-[10px] font-semibold uppercase tracking-wide text-gray-400">Volume</p>
                    <p class="mt-1 text-xl font-semibold text-gray-900 dark:text-white" x-text="volumeText"></p>
                  </div>
                  <div class="rounded-2xl border border-gray-200 bg-white p-4 shadow-theme-xs dark:border-gray-800 dark:bg-white/[0.03]">
                    <p class="text-[10px] font-semibold uppercase tracking-wide text-gray-400">Set selesai</p>
                    <p class="mt-1 text-xl font-semibold text-gray-900 dark:text-white" x-text="completedSets"></p>
                  </div>
                  <div class="rounded-2xl border border-gray-200 bg-white p-4 shadow-theme-xs dark:border-gray-800 dark:bg-white/[0.03]">
                    <p class="text-[10px] font-semibold uppercase tracking-wide text-gray-400">Gerakan</p>
                    <p class="mt-1 text-xl font-semibold text-gray-900 dark:text-white" x-text="exerciseCount"></p>
                  </div>
                </div>

                <!-- PR -->
                <div class="mt-5 rounded-2xl border border-amber-200 bg-gradient-to-br from-amber-50 to-orange-50 p-5 dark:border-amber-500/20 dark:from-amber-500/10 dark:to-orange-500/10">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                      <span class="flex size-10 items-center justify-center rounded-xl bg-white text-xl shadow-theme-xs dark:bg-gray-900">🏆</span>
                      <div>
                        <p class="text-sm font-semibold text-amber-900 dark:text-amber-200">Personal record sesi ini</p>
                        <p class="text-xs text-amber-700 dark:text-amber-300/80" x-text="prs.length ? prs.length + ' pencapaian baru!' : 'Belum ada PR baru, tetap konsisten!'"></p>
                      </div>
                    </div>
                  </div>
                  <div class="mt-3 grid gap-2 sm:grid-cols-2">
                    <template x-for="pr in prs" :key="pr.id">
                      <div class="flex items-center justify-between rounded-xl bg-white/70 px-3 py-2.5 dark:bg-white/5">
                        <div>
                          <p class="text-xs font-semibold text-gray-900 dark:text-white" x-text="pr.exerciseName"></p>
                          <p class="text-[11px] text-amber-700 dark:text-amber-300/80" x-text="prLabel(pr.type)"></p>
                        </div>
                        <span class="text-sm font-bold text-amber-700 dark:text-amber-300" x-text="prValue(pr)"></span>
                      </div>
                    </template>
                    <template x-if="prs.length === 0">
                      <p class="text-xs text-amber-700 dark:text-amber-300/80">Catat beban lebih tinggi atau repetisi lebih banyak untuk memicu PR berikutnya.</p>
                    </template>
                  </div>
                </div>

                <!-- Exercise breakdown -->
                <div class="mt-5 rounded-2xl border border-gray-200 bg-white shadow-theme-xs dark:border-gray-800 dark:bg-white/[0.03]">
                  <div class="border-b border-gray-100 px-5 py-4 dark:border-gray-800">
                    <h3 class="text-base font-semibold text-gray-900 dark:text-white">Rincian gerakan</h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Set yang dicatat pada sesi ini</p>
                  </div>
                  <div class="divide-y divide-gray-100 dark:divide-gray-800">
                    <template x-for="(ex, index) in session.exercises" :key="ex.id">
                      <div class="px-5 py-4">
                        <div class="flex items-center gap-3">
                          <span class="flex size-7 items-center justify-center rounded-lg bg-gray-100 text-[11px] font-bold text-gray-500 dark:bg-white/5 dark:text-gray-400" x-text="index + 1"></span>
                          <div class="min-w-0 flex-1">
                            <p class="truncate text-sm font-semibold text-gray-900 dark:text-white" x-text="$store.app.exerciseById(ex.exerciseId).name"></p>
                            <p class="text-[11px] text-gray-500 dark:text-gray-400" x-text="ex.sets.length + ' set · ' + $store.app.exerciseById(ex.exerciseId).muscle"></p>
                          </div>
                          <span class="rounded-full bg-gray-100 px-2 py-1 text-[10px] font-semibold text-gray-600 dark:bg-white/5 dark:text-gray-300" x-text="ex.sets.filter(s => s.isCompleted).length + ' selesai'"></span>
                        </div>
                        <div class="mt-2 flex flex-wrap gap-1.5">
                          <template x-for="set in ex.sets" :key="set.id">
                            <span class="rounded-lg bg-gray-50 px-2.5 py-1 text-[11px] font-medium text-gray-600 dark:bg-white/5 dark:text-gray-300" x-text="weightText(set.weight) + ' × ' + set.reps"></span>
                          </template>
                        </div>
                        <p x-show="ex.note" class="mt-2 text-[11px] italic text-gray-500 dark:text-gray-400" x-text="ex.note"></p>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Journal -->
                <div class="mt-5 rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-xs dark:border-gray-800 dark:bg-white/[0.03]">
                  <div class="flex items-center justify-between">
                    <div>
                      <h3 class="text-base font-semibold text-gray-900 dark:text-white">Jurnal sesi</h3>
                      <p class="text-xs text-gray-500 dark:text-gray-400">Opsional, tapi membantu melihat pola pemulihan.</p>
                    </div>
                    <button type="button" @click="editing = !editing" class="rounded-lg border border-gray-200 px-3 py-1.5 text-xs font-semibold text-gray-600 transition hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5" x-text="editing ? 'Batal' : 'Edit'"></button>
                  </div>

                  <div x-show="!editing" class="mt-3">
                    <template x-if="journal.notes || journal.tags.length">
                      <div>
                        <p class="whitespace-pre-line rounded-xl bg-gray-50 p-3 text-sm text-gray-700 dark:bg-white/5 dark:text-gray-300" x-text="journal.notes || 'Tanpa catatan teks.'"></p>
                        <div class="mt-3 flex flex-wrap gap-2">
                          <template x-for="tag in journal.tags" :key="tag">
                            <span class="rounded-full bg-brand-50 px-2.5 py-1 text-[11px] font-medium text-brand-600 dark:bg-brand-500/15 dark:text-brand-400" x-text="'#' + tag"></span>
                          </template>
                        </div>
                        <div class="mt-3 flex flex-wrap gap-4 text-[11px] text-gray-500 dark:text-gray-400">
                          <span>Kelelahan: <strong class="text-gray-700 dark:text-gray-300" x-text="journal.fatigue || '—'"></strong>/5</span>
                          <span>Tidur: <strong class="text-gray-700 dark:text-gray-300" x-text="journal.sleep || '—'"></strong>/5</span>
                          <span>Mood: <strong class="text-gray-700 dark:text-gray-300" x-text="journal.mood || '—'"></strong>/5</span>
                        </div>
                      </div>
                    </template>
                    <template x-if="!journal.notes && !journal.tags.length">
                      <div class="rounded-xl border border-dashed border-gray-200 p-5 text-center dark:border-gray-700">
                        <p class="text-xl">📝</p>
                        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Belum ada jurnal untuk sesi ini.</p>
                        <button type="button" @click="editing = true" class="mt-2 text-xs font-semibold text-brand-500">Tulis jurnal</button>
                      </div>
                    </template>
                  </div>

                  <div x-show="editing" x-cloak class="mt-4 space-y-4">
                    <textarea x-model="journal.notes" rows="3" placeholder="Evaluasi sesi: teknik, energi, kendala..." class="w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2.5 text-sm text-gray-800 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:text-white"></textarea>
                    <div class="grid gap-3 sm:grid-cols-3">
                      <template x-for="scale in [{key:'fatigue',label:'Kelelahan'},{key:'sleep',label:'Kualitas tidur'},{key:'mood',label:'Mood / energi'}]" :key="scale.key">
                        <div>
                          <p class="mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300" x-text="scale.label"></p>
                          <div class="flex gap-1">
                            <template x-for="value in [1,2,3,4,5]" :key="value">
                              <button type="button" @click="setScale(scale.key, value)" class="flex size-9 items-center justify-center rounded-lg border text-xs font-semibold transition" :class="journal[scale.key] === value ? 'border-brand-500 bg-brand-500 text-white' : 'border-gray-200 text-gray-500 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-white/5'" x-text="value"></button>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                    <input type="text" x-model="tagsText" placeholder="Tag kendala, pisahkan dengan koma" class="h-10 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 dark:border-gray-700 dark:text-white" />
                    <button type="button" @click="saveJournal()" class="rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-600">Simpan jurnal</button>
                  </div>
                </div>

                <div class="mt-5 flex flex-col gap-2 sm:flex-row">
                  <button type="button" @click="goDashboard()" class="flex-1 rounded-lg bg-brand-500 px-4 py-3 text-sm font-semibold text-white hover:bg-brand-600">Kembali ke Dashboard</button>
                  <a href="journal.html" class="flex-1 rounded-lg border border-gray-200 px-4 py-3 text-center text-sm font-semibold text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5">Lihat semua jurnal</a>
                </div>
              </div>
            </template>

            <!-- Template modal -->
            <div x-cloak x-show="templateOpen" x-transition.opacity class="fixed inset-0 z-[70] flex items-center justify-center bg-gray-900/50 p-4 backdrop-blur-sm">
              <div @click.outside="templateOpen = false" class="w-full max-w-sm rounded-2xl bg-white p-5 shadow-2xl dark:bg-gray-900">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Simpan sebagai template</h3>
                <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Simpan struktur gerakan dan set untuk sesi berikutnya.</p>
                <label class="mt-4 mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Nama template</label>
                <input type="text" x-model="templateName" class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:text-white" />
                <div class="mt-5 flex gap-2">
                  <button type="button" @click="templateOpen = false" class="flex-1 rounded-lg border border-gray-200 px-3 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5">Batal</button>
                  <button type="button" @click="saveTemplate()" class="flex-1 rounded-lg bg-brand-500 px-3 py-2.5 text-sm font-semibold text-white hover:bg-brand-600">Simpan</button>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <include src="./partials/layout/bottom-nav.html" />
    <include src="./partials/layout/rest-timer.html" />
    <include src="./partials/layout/toast.html" />
    <include src="./partials/layout/pr-celebration.html" />
  </body>
</html>
