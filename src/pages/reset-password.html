<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#465fff" />
    <meta name="description" content="Atur ulang password akun Gym Tracker." />
    <title>Lupa Password | Gym Tracker</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="images/favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body
    style="visibility: hidden"
    data-page="reset-password"
    data-auth="guest"
    x-data="appShell('reset-password')"
    :class="{ 'dark': darkMode }"
    class="bg-white font-outfit text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100"
  >
    <div class="flex min-h-screen">
      <include src="./partials/auth/brand-panel.html" />

      <div class="flex w-full flex-col lg:w-1/2">
        <div class="flex items-center justify-between px-5 pt-5 sm:px-8 lg:justify-end">
          <a href="index.html" class="flex items-center gap-2.5 lg:hidden" aria-label="Gym Tracker">
            <span class="flex size-10 items-center justify-center rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 shadow-lg shadow-brand-500/25">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 9.5v5M7 7.5v9M17 7.5v9M20 9.5v5M7 12h10" stroke="white" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
            <span class="leading-tight">
              <span class="block text-base font-semibold tracking-tight text-gray-900 dark:text-white">Gym Tracker</span>
              <span class="block text-[9px] font-semibold uppercase tracking-[0.18em] text-brand-500">Track your gains</span>
            </span>
          </a>
          <button
            type="button"
            @click="darkMode = !darkMode"
            class="inline-flex size-10 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-600 transition hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300 dark:hover:bg-gray-800"
            :aria-label="darkMode ? 'Aktifkan mode terang' : 'Aktifkan mode gelap'"
          >
            <svg x-show="darkMode" width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6" />
              <path d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <svg x-show="!darkMode" width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M6.25 6.67a6.67 6.67 0 0 0 11.2 4.88A7.71 7.71 0 1 1 8.03 2.13a6.65 6.65 0 0 0-1.78 4.54Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <main class="flex flex-1 items-center px-5 py-10 sm:px-8">
          <div class="mx-auto w-full max-w-md" x-data="resetPage()">
            <template x-if="!sent">
              <div>
                <span class="flex size-12 items-center justify-center rounded-2xl bg-brand-50 text-brand-500 dark:bg-brand-500/15">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z" stroke="currentColor" stroke-width="1.6" /><path d="m5 7 7 5 7-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
                </span>
                <h1 class="mt-5 text-3xl font-semibold tracking-tight text-gray-900 dark:text-white">Lupa password?</h1>
                <p class="mt-2 text-sm leading-relaxed text-gray-500 dark:text-gray-400">
                  Masukkan email akunmu. Di versi demo ini, instruksi reset ditampilkan langsung tanpa mengirim email sungguhan.
                </p>

                <form class="mt-7 space-y-4" @submit.prevent="submit()" novalidate>
                  <p x-show="error" x-cloak class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-600 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-400" x-text="error"></p>
                  <div>
                    <label for="email" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
                    <input
                      id="email"
                      type="email"
                      autocomplete="email"
                      x-model.trim="email"
                      placeholder="nama@email.com"
                      class="h-12 w-full rounded-xl border border-gray-300 bg-transparent px-4 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:text-white"
                    />
                  </div>
                  <button type="submit" class="h-12 w-full rounded-xl bg-brand-500 text-sm font-semibold text-white shadow-theme-xs transition hover:bg-brand-600">Kirim instruksi reset</button>
                </form>
              </div>
            </template>

            <template x-if="sent">
              <div>
                <span class="flex size-12 items-center justify-center rounded-2xl bg-green-50 text-green-500 dark:bg-green-500/15">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                </span>
                <h1 class="mt-5 text-3xl font-semibold tracking-tight text-gray-900 dark:text-white">Instruksi terkirim</h1>
                <p class="mt-2 text-sm leading-relaxed text-gray-500 dark:text-gray-400">
                  Jika <span class="font-medium text-gray-700 dark:text-gray-300" x-text="email"></span> terdaftar, kamu akan menerima tautan reset. Untuk demo lokal, gunakan akun <span class="font-medium text-gray-700 dark:text-gray-300">demo@gymtracker.app</span> dengan password <span class="font-medium text-gray-700 dark:text-gray-300">demo1234</span>.
                </p>
                <div class="mt-6 flex flex-col gap-2 sm:flex-row">
                  <a href="signin.html" class="flex h-12 flex-1 items-center justify-center rounded-xl bg-brand-500 text-sm font-semibold text-white hover:bg-brand-600">Kembali ke halaman masuk</a>
                  <button type="button" @click="sent = false; email = ''" class="flex h-12 flex-1 items-center justify-center rounded-xl border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5">Kirim ulang</button>
                </div>
              </div>
            </template>
          </div>
        </main>
      </div>
    </div>

    <include src="./partials/layout/toast.html" />
  </body>
</html>
