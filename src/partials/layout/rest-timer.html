<!-- Floating rest timer -->
<div
  x-data
  x-cloak
  x-show="$store.restTimer.visible"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="translate-y-4 opacity-0"
  x-transition:enter-end="translate-y-0 opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="translate-y-0 opacity-100"
  x-transition:leave-end="translate-y-4 opacity-0"
  class="fixed inset-x-4 bottom-24 z-[60] mx-auto max-w-md xl:bottom-6"
  role="status"
  aria-live="polite"
>
  <div class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-theme-xl dark:border-gray-700 dark:bg-gray-900">
    <div class="h-1 w-full bg-gray-100 dark:bg-gray-800">
      <div class="h-1 bg-gradient-to-r from-brand-500 to-brand-400 transition-all duration-300" :style="`width:${$store.restTimer.progress}%`"></div>
    </div>
    <div class="p-4">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <span class="flex size-10 items-center justify-center rounded-xl bg-brand-50 text-brand-500 dark:bg-brand-500/15">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="1.7" /><path d="M12 9v4l2.5 2.5M9 2h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
          </span>
          <div>
            <p class="text-[11px] font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Rest timer</p>
            <p class="font-mono text-2xl font-semibold tabular-nums text-gray-900 dark:text-white" x-text="$store.restTimer.label"></p>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <button type="button" @click="$store.restTimer.muted = !$store.restTimer.muted" class="flex size-9 items-center justify-center rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-white/5" :aria-label="$store.restTimer.muted ? 'Nyalakan bunyi' : 'Bisukan bunyi'">
            <svg x-show="!$store.restTimer.muted" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Zm5.5 4.5a4 4 0 0 1 0 5M19 7a8 8 0 0 1 0 10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <svg x-show="$store.restTimer.muted" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Zm5 5 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <button type="button" @click="$store.restTimer.skip()" class="rounded-lg border border-gray-200 px-3 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5">Lewati</button>
        </div>
      </div>

      <div class="mt-3 grid grid-cols-4 gap-2">
        <button type="button" @click="$store.restTimer.add(-15)" class="h-10 rounded-lg bg-gray-100 text-xs font-semibold text-gray-700 transition hover:bg-gray-200 dark:bg-white/5 dark:text-gray-300 dark:hover:bg-white/10">−15 dtk</button>
        <button type="button" @click="$store.restTimer.toggle()" class="flex h-10 items-center justify-center gap-1.5 rounded-lg bg-brand-500 text-xs font-semibold text-white transition hover:bg-brand-600">
          <svg x-show="$store.restTimer.running" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="3" height="10" rx="1" /><rect x="9" y="3" width="3" height="10" rx="1" /></svg>
          <svg x-show="!$store.restTimer.running" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3.5 12 8l-7 4.5v-9Z" /></svg>
          <span x-text="$store.restTimer.running ? 'Pause' : 'Lanjut'"></span>
        </button>
        <button type="button" @click="$store.restTimer.add(15)" class="h-10 rounded-lg bg-gray-100 text-xs font-semibold text-gray-700 transition hover:bg-gray-200 dark:bg-white/5 dark:text-gray-300 dark:hover:bg-white/10">+15 dtk</button>
        <button type="button" @click="$store.restTimer.reset()" class="h-10 rounded-lg bg-gray-100 text-xs font-semibold text-gray-700 transition hover:bg-gray-200 dark:bg-white/5 dark:text-gray-300 dark:hover:bg-white/10">Ulang</button>
      </div>

      <div class="mt-2 flex items-center gap-2">
        <span class="text-[10px] font-medium uppercase tracking-wider text-gray-400">Preset</span>
        <template x-for="preset in [60, 90, 120]" :key="preset">
          <button type="button" @click="$store.restTimer.start(preset)" class="rounded-full px-3 py-1 text-[11px] font-semibold transition" :class="$store.restTimer.total === preset ? 'bg-brand-50 text-brand-600 dark:bg-brand-500/15 dark:text-brand-400' : 'bg-gray-100 text-gray-500 hover:bg-gray-200 dark:bg-white/5 dark:text-gray-400'" x-text="preset + ' dtk'"></button>
        </template>
      </div>
    </div>
  </div>
</div>
