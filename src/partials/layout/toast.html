<!-- Toast stack -->
<div class="pointer-events-none fixed inset-x-4 top-4 z-[9999] flex flex-col items-end gap-2 sm:inset-x-auto sm:right-6 sm:top-6" aria-live="polite">
  <template x-for="toast in $store.toast.items" :key="toast.id">
    <div
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="translate-y-2 opacity-0"
      x-transition:enter-end="translate-y-0 opacity-100"
      class="pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-xl border bg-white p-3.5 shadow-theme-lg dark:bg-gray-900"
      :class="{
        'border-green-200 dark:border-green-500/30': toast.type === 'success',
        'border-red-200 dark:border-red-500/30': toast.type === 'error',
        'border-orange-200 dark:border-orange-500/30': toast.type === 'warning',
        'border-brand-200 dark:border-brand-500/30': toast.type === 'info'
      }"
    >
      <span class="mt-0.5 flex size-7 shrink-0 items-center justify-center rounded-full text-sm"
        :class="{
          'bg-green-50 text-green-600 dark:bg-green-500/15 dark:text-green-400': toast.type === 'success',
          'bg-red-50 text-red-600 dark:bg-red-500/15 dark:text-red-400': toast.type === 'error',
          'bg-orange-50 text-orange-600 dark:bg-orange-500/15 dark:text-orange-400': toast.type === 'warning',
          'bg-brand-50 text-brand-600 dark:bg-brand-500/15 dark:text-brand-400': toast.type === 'info'
        }"
      >
        <template x-if="toast.type === 'success'"><span>✓</span></template>
        <template x-if="toast.type === 'error'"><span>!</span></template>
        <template x-if="toast.type === 'warning'"><span>!</span></template>
        <template x-if="toast.type === 'info'"><span>i</span></template>
      </span>
      <p class="min-w-0 flex-1 pt-0.5 text-sm font-medium text-gray-700 dark:text-gray-200" x-text="toast.message"></p>
      <button type="button" @click="$store.toast.remove(toast.id)" class="shrink-0 rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600 dark:hover:bg-white/5" aria-label="Tutup notifikasi">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="m2 2 10 10M12 2 2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
      </button>
    </div>
  </template>
</div>
